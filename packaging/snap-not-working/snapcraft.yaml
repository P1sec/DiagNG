name: diagng # you probably want to 'snapcraft register <name>'
adopt-info: share
title: diagng
license: GPL-3.0+
base: core26 # the base snap is the execution environment for this snap
version: '0.1.4' # just for humans, typically '1.2+git' or '1.3.3'

grade: stable # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots

environment:
  PYTHONPATH: "$SNAP/gnome-platform/usr/lib/python3.14/lib-dynload:${PYTHONPATH}"

apps:
  diagng:
    command: bin/diagng
    desktop: usr/share/applications/com.p1security.diagng.desktop
    extensions: [gnome]
    plugs:
      - home
      - unity7
      - network
      - network-status
      - hardware-observe
      - modem-manager
      - raw-usb
      - diagmond-svc
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/android:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
    slots: [dbus-svc]

slots:
  dbus-svc: # name that is used with 'snap connect' on slots side
    interface: dbus
    bus: session
    name: com.p1security.diagng

plugs:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  diagmond-svc:
    bus: system
    interface: dbus
    name: com.p1security.diagmond
    # ⚠️ BLOCKED: We have no solution
    #  with the current `snapd` version
    #  to connect to a custom D-Bus
    #  service on the host system.
  modemmanager-svc:
    bus: system
    interface: dbus
    name: org.freedesktop.ModemManager1

parts:
  diagng:
    plugin: python
    source: .

    python-packages:
      # The development tree for PyUSB has a
      # Snap support-specific patch, but
      # the PyPI distribution doesn't
      - git+https://github.com/pyusb/pyusb.git@3241c0e

    stage-packages:
      - libdrm-common
      - adb

    after: [python-runtime]

  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - libusb-1.0-0
      - python3-minimal # for the "python3" symlink
      - python3.14-minimal
      - python3.14-venv
      - gir1.2-modemmanager-1.0
      - gir1.2-gtksource-5

  share:
    plugin: dump
    source: src/diagng/ui/assets/share/
    parse-info: [usr/share/metainfo/com.p1security.diagng.metainfo.xml]
    source-type: local

    override-pull: |
      craftctl default

      sed -i -e 's|Icon=com.p1security.diagng|Icon=/usr/share/icons/hicolor/scalable/apps/com.p1security.diagng.svg|g' applications/com.p1security.diagng.desktop
      mkdir -p usr/share
      mv applications dbus-1 icons metainfo polkit-1 usr/share
      chmod -R 644 usr/share

layout:
  /usr/share/libdrm:
    bind: $SNAP/usr/share/libdrm
