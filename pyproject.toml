
[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "qcsuper"
version = "3.0.0"
description = "Draft for QCSuper v3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygobject>=3.56.3",
]

[project.scripts]
qcsuper = "qcsuper.common.main_entry:main"

[project.urls]
Homepage = "https://github.com/P1sec/qcsuper-v3"
Repository = "https://github.com/P1sec/qcsuper-v3"
Issues = "https://github.com/P1sec/qcsuper-v3/issues"

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

