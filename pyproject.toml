
[build-system]
requires = [
    # Build dependencies for own project (we
    # don't use uv_build as it is hard to
    # bundle into Flatpak)
    "setuptools>=69",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "diagng"
version = "0.1.0"
description = "Draft for DiagNG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygobject>=3.56.2",
]

[project.scripts]
diagng = "diagng.common.main_entry:main"

[project.urls]
Homepage = "https://github.com/P1sec/DiagNG"
Repository = "https://github.com/P1sec/DiagNG"
Issues = "https://github.com/P1sec/DiagNG/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diagng.ui.assets" = [
    "diagng.gresource",
    "com.p1security.diagng.metainfo.xml",
    "com.p1security.diagng.desktop",
    "com.p1security.diagng.svg"
]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

