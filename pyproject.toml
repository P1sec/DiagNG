
[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "qcsuperd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygobject>=3.56.3",
]

[project.scripts]
qcsuperd-test = "qcsuperd.common.app:main"

[project.urls]
Homepage = "https://github.com/P1sec/qcsuperd"
Repository = "https://github.com/P1sec/qcsuperd"
Issues = "https://github.com/P1sec/qcsuperd/issues"

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "single"

